[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paulitools"
version = "2.0"
description = "Efficient Pauli string manipulation and analysis"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
authors = [
    { name = "Thomas Steckmann", email = "tmsteckm@gmail.com" },
]
dependencies = [
    "numpy",
    "numba",
    "galois",
    "joblib",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paulitools = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["testing"]
python_files = ["test_*.py", "*_test.py"]
