[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paulitools"
version = "2.0"
description = "Efficient Pauli string manipulation and analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Thomas Steckmann", email = "tmsteckm@gmail.com" },
]
dependencies = [
    "numpy>=1.22",
    "numba>=0.58.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]
verification = ["pytest>=7", "galois>=0.3.7"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paulitools = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["testing"]
python_files = ["test_*.py", "*_test.py"]
